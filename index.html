<!DOCTYPE html>
<html lang="zh-CN" mdui-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>3D 名片</title>
<link rel="stylesheet" href="https://unpkg.com/mdui@2/mdui.global.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <header class="header">
    <!-- 改名字 -->
    <div class="title">松鼠老方的电子名片</div>
  </header>

  <main class="stage">
    <div class="scene" id="scene">
      <div class="card" id="card">
        <!-- 名片正面和背面，可以改路径 -->
        <div class="face front"><img src="正.png" alt="名片正面" draggable="false"></div>
        <div class="face back"><img src="反.png" alt="名片背面" draggable="false"></div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <!-- main.js改网站跳转，图标可以看 https://www.mdui.org/zh-cn/docs/2/libraries/icons  -->
    <div class="bar">
      <mdui-fab id="back" variant="tonal" class="ctrl" title="GitHub">
        <svg class="fab-icon" slot="icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"></path>
        </svg>
        <span class="label">GitHub</span>
      </mdui-fab>
      <mdui-fab id="toggle" variant="filled" class="ctrl">
        <svg class="fab-icon" slot="icon" viewBox="0 0 24 24" fill="currentColor">
          <path id="iconPath" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path>
        </svg>
        <span class="label" id="label">暂停旋转</span>
      </mdui-fab>
      <mdui-fab id="home" variant="tonal" class="ctrl" title="主页">
        <svg class="fab-icon" slot="icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"></path>
        </svg>
        <span class="label">主页</span>
      </mdui-fab>
    </div>
  </footer>
</div>

<script src="https://unpkg.com/mdui@2/mdui.global.js"></script>
<script src="main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>3D 名片</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="https://unpkg.com/mdui@2/mdui.css">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script>
/* 在页面渲染前套用主题，避免暗色模式先闪一下白底 */
(function () {
  var mode = (window.名片配置 || {}).暗色模式;
  if (mode === 'auto') {
    mode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  } else if (mode !== 'dark') {
    mode = 'light';
  }
  document.documentElement.classList.add('mdui-theme-' + mode);
})();
</script>
</head>
<body>
<div class="page">
  <header class="header">
    <!-- 标题在 config.js 里改 -->
    <div class="title" id="cardTitle">松鼠老方的电子名片</div>
  </header>

  <main class="stage">
    <div class="scene" id="scene">
      <div class="card" id="card">
        <!-- 正反面图片在 config.js 里换 -->
        <div class="face front"><img id="frontImg" src="front.png" alt="名片正面" draggable="false"></div>
        <div class="face back"><img id="backImg" src="back.png" alt="名片背面" draggable="false"></div>
        <div class="core"></div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <!-- 社交媒体图标栏，内容由 config.js 里的「社交媒体」决定 -->
    <div class="social-tray" id="socialTray" aria-hidden="true"></div>
    <div class="bar">
      <mdui-fab id="about" variant="tonal" class="ctrl" title="关于">
        <svg class="fab-icon" slot="icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 16h-2v-6h2v6zm0-8h-2V8h2v2z"></path>
        </svg>
        <span class="label">关于</span>
      </mdui-fab>
      <mdui-fab id="toggle" variant="filled" class="ctrl">
        <svg class="fab-icon" slot="icon" viewBox="0 0 24 24" fill="currentColor">
          <path id="iconPath" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path>
        </svg>
        <span class="label" id="label">暂停旋转</span>
      </mdui-fab>
      <!-- 点开向上展开成一排社交媒体图标 -->
      <mdui-fab id="social" variant="tonal" class="ctrl" title="社交媒体" aria-expanded="false" aria-controls="socialTray">
        <svg class="fab-icon" slot="icon" viewBox="0 0 24 24" fill="currentColor">
          <path fill-rule="evenodd" d="M12 1.8C14.9 4.2 16.5 7.7 16.5 11.5V15.3H7.5V11.5C7.5 7.7 9.1 4.2 12 1.8ZM13.9 9.6A1.9 1.9 0 1 1 10.1 9.6A1.9 1.9 0 1 1 13.9 9.6ZM7.5 11.5L4.2 14.2V17.6L7.5 15.8ZM16.5 11.5L19.8 14.2V17.6L16.5 15.8ZM10.3 16.3H13.7L12 20.6Z"></path>
        </svg>
        <span class="label">社交</span>
      </mdui-fab>
    </div>
  </footer>
</div>

<mdui-dialog id="aboutDialog" close-on-overlay-click close-on-esc>
  <div class="about-body">
    <!-- 弹窗标题、链接、版权和备案都在 config.js 里的「关于」中修改 -->
    <div class="about-title" id="aboutTitle">关于</div>
    <div class="about-links" id="aboutLinks"></div>
    <div class="about-footer" id="aboutFooter" hidden></div>
  </div>
  <mdui-button slot="action" variant="tonal" id="aboutClose">关闭</mdui-button>
</mdui-dialog>

<script src="https://unpkg.com/mdui@2/mdui.global.js"></script>
<script src="main.js"></script>
</body>
</html>
